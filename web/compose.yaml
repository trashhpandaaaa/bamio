# Bamio on one server (a DigitalOcean Droplet, or any Linux machine with Docker): Caddy (HTTPS
# for your domain, certificates renewed automatically), Postgres, and the app, which serves the
# site and does the processing. Videos, exports and the speech models live on the server's disk
# (the appdata volume). Step by step: DEPLOY.md. In short, from web/ on the server:
#   cp .env.example .env      then fill in DOMAIN, POSTGRES_PASSWORD, the Clerk keys, GEMINI_API_KEY
#   docker compose up -d --build
# Update after a git pull: docker compose up -d --build

services:
  app:
    build:
      context: .
      args:
        # Built into the pages (it's public); everything secret is read at run time from .env.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set it in .env}
    env_file: .env
    environment:
      DATABASE_URL: postgres://bamio:${POSTGRES_PASSWORD:?set it in .env}@postgres:5432/bamio
      BAMIO_APP_URL: https://${DOMAIN:?set it in .env}
      STORAGE_DRIVER: local
    volumes:
      # /data/media (videos, exports), /data/work (work in progress), /data/models (speech models, fonts).
      - appdata:/data
    depends_on:
      postgres: { condition: service_healthy }
    # Running jobs are handed back to the queue on stop; give them time.
    stop_grace_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bamio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: bamio
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bamio"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set it in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
  caddy:
